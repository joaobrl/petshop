server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Spring Cloud Gateway 5.x (Spring Cloud 2025.x) renomeou o módulo
      # pra "server.webflux" - as propriedades moraram pra
      # spring.cloud.gateway.server.webflux.*, não mais spring.cloud.gateway.*
      # direto (resíduo da época em que só existia a variante reativa).
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 15s
          # CORS é resolvido uma vez só, aqui - os 5 serviços downstream não
          # precisam mais conhecer a origem do frontend, só o gateway.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: [Authorization, Content-Type, Idempotency-Key]
                # Bearer token vai no header Authorization, não em cookie de
                # sessão - allowCredentials fica false (ver docs/pendencias-frontend.md,
                # item 2.2: trocar isso só faria sentido se o modelo de auth migrar
                # pra cookie httpOnly).
                allowCredentials: false
                maxAge: 3600
          # Cada rota agrupa os paths de um mesmo microsserviço - nenhum dos 6
          # serviços colide em prefixo de path hoje, então não é preciso
          # StripPrefix/RewritePath: o path que chega no gateway é o mesmo que
          # cada serviço já espera receber diretamente.
          routes:
            - id: customer-management
              uri: ${GATEWAY_CUSTOMERS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/customers/**,/api/v1/staff/**,/api/v1/history/**
            - id: product-registration
              uri: ${GATEWAY_PRODUCTS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**
            - id: staff-service
              uri: ${GATEWAY_STAFF_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/availability/**,/api/v1/weekend-allocation/**
            - id: booking-service
              uri: ${GATEWAY_BOOKING_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/bookings/**
            - id: order-service
              uri: ${GATEWAY_ORDER_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/cart/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
