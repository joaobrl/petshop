server:
  port: ${SERVER_PORT:8080}
  # O gateway é a borda: o IP do cliente é o do socket, nunca o que vem em
  # header. Explícito porque o Spring Boot liga "native" sozinho quando
  # detecta Kubernetes, e aí o Netty trocaria o remoteAddress pelo 1º
  # elemento do X-Forwarded-For enviado pelo cliente (SDD-028).
  forward-headers-strategy: none

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Spring Cloud Gateway 5.x (Spring Cloud 2025.x) renomeou o módulo
      # pra "server.webflux" - as propriedades moraram pra
      # spring.cloud.gateway.server.webflux.*, não mais spring.cloud.gateway.*
      # direto (resíduo da época em que só existia a variante reativa).
      server:
        webflux:
          # X-Forwarded-For (SDD-028): o downstream (rate limit de login do
          # customer-management, SDD-003) precisa receber o IP real do cliente
          # como último elemento da cadeia, e nada forjado pelo cliente.
          #
          # "trusted-proxies" fica DE PROPÓSITO sem valor. Na 5.0.2 (conferido
          # no bytecode), sem ele o gateway registra o
          # RemoveXForwardedHeadersFilter e o RemoveForwardedHeadersFilter, que
          # apagam todo X-Forwarded-* / Forwarded recebido do cliente. Depois
          # deles, o ClientIpXForwardedForHeadersFilter (código deste módulo)
          # escreve X-Forwarded-For = IP do peer TCP, e só ele.
          #
          # Por que não só "trusted-proxies": com uma regex restrita, peer que
          # não casa tem o header APAGADO e o IP dele não é acrescentado (o
          # downstream fica sem XFF); com ".*", o peer é acrescentado no fim
          # mas o que o cliente mandou fica à esquerda — e, se o IP do cliente
          # estiver na allowlist do downstream, o valor forjado vira o "IP
          # real". Também NÃO ligar httpserver.customizer-enabled: com
          # trusted-proxies setado ele faz o Netty adotar o 1º elemento do XFF
          # do cliente como remoteAddress.
          #
          # Quando houver LB/ingress na frente do gateway: o peer passa a ser o
          # LB. Aí o filtro deve manter a cadeia recebida e acrescentar o peer
          # SÓ quando o peer for o LB (IP/CIDR fixo), e descartá-la nos demais
          # casos; e RATE_LIMIT_TRUSTED_PROXIES do customer-management passa a
          # ter o gateway E o LB (ele lê a cadeia da direita para a esquerda).
          httpclient:
            connect-timeout: 5000
            response-timeout: 15s
          # CORS é resolvido uma vez só, aqui - os 5 serviços downstream não
          # precisam mais conhecer a origem do frontend, só o gateway.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: [Authorization, Content-Type]
                # Bearer token vai no header Authorization, não em cookie de
                # sessão - allowCredentials fica false (ver docs/pendencias-frontend.md,
                # item 2.2: trocar isso só faria sentido se o modelo de auth migrar
                # pra cookie httpOnly).
                allowCredentials: false
                maxAge: 3600
          # Cada rota agrupa os paths de um mesmo microsserviço - nenhum dos 6
          # serviços colide em prefixo de path hoje, então não é preciso
          # StripPrefix/RewritePath: o path que chega no gateway é o mesmo que
          # cada serviço já espera receber diretamente.
          routes:
            - id: customer-management
              uri: ${GATEWAY_CUSTOMERS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/customers/**,/api/v1/staff/**,/api/v1/history/**
            - id: product-registration
              uri: ${GATEWAY_PRODUCTS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**
            - id: staff-service
              uri: ${GATEWAY_STAFF_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/availability/**,/api/v1/weekend-allocation/**
            - id: booking-service
              uri: ${GATEWAY_BOOKING_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/bookings/**
            - id: order-service
              uri: ${GATEWAY_ORDER_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/cart/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
