server:
  port: ${SERVER_PORT:8085}

external:
  api:
    customer-management:
      url: ${EXTERNAL_API_CUSTOMER_MANAGEMENT_URL:http://localhost:8082}

spring:
  application:
    name: staff-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: BASIC
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/staff_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Resource Server (SDD-024): valida o access token do Keycloak. O JWKS é buscado
# pela rede interna (http://keycloak:8080 no compose); o iss esperado é o público,
# fixado no Keycloak por KC_HOSTNAME. audience = id deste serviço, que precisa
# estar no aud do token (audience mappers do realm petshop).
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/petshop}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/petshop/protocol/openid-connect/certs}
  audience: ${KEYCLOAK_AUDIENCE:staff-service}
  # Client Credentials das chamadas Feign sem usuário para repassar (client
  # staff-service do realm; segredo = KEYCLOAK_CLIENT_SECRET_* do .env).
  client:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/petshop/protocol/openid-connect/token}
    id: ${KEYCLOAK_CLIENT_ID:staff-service}
    secret: ${KEYCLOAK_CLIENT_SECRET:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"

# Quantos funcionários de tosa/banho (GROOMER) trabalham em cada sábado.
# Variável de fácil manutenção pedida no escopo — muda aqui (ou via env var),
# sem precisar mexer em código.
staff:
  groomer:
    saturday-staff-count: ${STAFF_GROOMER_SATURDAY_COUNT:2}
