spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    # Sem "hibernate.dialect" fixo de propósito: esse arquivo também é lido
    # pelo StaffPersistenceIntegrationTest, que sobrescreve o datasource pra
    # um Postgres real via Testcontainers (@ServiceConnection) — só o
    # datasource é trocado, não uma propriedade de dialeto fixa. Fixar aqui
    # quebraria esse teste do mesmo jeito que quebrou no booking-service
    # (Hibernate gerando DDL de H2, tipo "tinyint", contra Postgres real). O
    # Hibernate 6+ detecta o dialeto certo sozinho a partir da conexão JDBC.
# Faltando aqui, cai no default do @Value/@ConfigurationProperties (se
# houver) — mantido explícito por clareza, mesmo valor do main/resources.
staff:
  groomer:
    saturday-staff-count: 2

server:
  port: 8085

# Keycloak de teste (SDD-024 RF4): sem Keycloak real. Os testes assinam RS256 com
# chave gerada em memória (support.TestJwtService) e o support.TestJwtDecoderConfig
# troca o JwtDecoder do JWKS por um que confere essa chave, com os mesmos
# validadores de produção (iss/exp/aud abaixo). O jwk-set-uri nunca é chamado.
keycloak:
  issuer-uri: http://localhost:8180/realms/petshop
  jwk-set-uri: http://localhost:8180/realms/petshop/protocol/openid-connect/certs
  audience: staff-service
  client:
    token-uri: http://localhost:8180/realms/petshop/protocol/openid-connect/token
    id: staff-service
    secret: test-client-secret
