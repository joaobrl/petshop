apiVersion: v1
kind: ConfigMap
metadata:
  name: api-clientes-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://db-clientes-svc:5432/clientes_db
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  # Config estava desatualizada em relação ao app atual (faltava Mongo e Kafka,
  # já obrigatórios pra o customer-management subir).
  SPRING_DATA_MONGODB_URI: mongodb://mongo-svc:27017/customer_history_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-svc:9092
  KAFKA_CONSUMER_GROUP: customer-group
  JWT_EXPIRATION_MINUTES: "15"
  # Vazio de propósito = não confia em ninguém: o rate limit de login ignora
  # X-Forwarded-For e conta pelo remoteAddr (SDD-003 RNF4). Não há gateway
  # nem ingress nos manifests e o Service é NodePort, então uma faixa como
  # 10.0.0.0/8 confiaria em IPs de nó e aceitaria XFF forjado por qualquer
  # cliente. Preencher só quando o gateway/ingress rodar no cluster, com o
  # IP/CIDR mais estreito possível dele (pod CIDR do gateway ou IP do
  # ingress controller), nunca a faixa do cluster inteira.
  RATE_LIMIT_TRUSTED_PROXIES: ""