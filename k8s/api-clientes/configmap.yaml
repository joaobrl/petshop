apiVersion: v1
kind: ConfigMap
metadata:
  name: api-clientes-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://db-clientes-svc:5432/clientes_db
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  # Config estava desatualizada em relação ao app atual (faltava Mongo e Kafka,
  # já obrigatórios pra o customer-management subir).
  SPRING_DATA_MONGODB_URI: mongodb://mongo-svc:27017/customer_history_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-svc:9092
  KAFKA_CONSUMER_GROUP: customer-group
  # Rede interna do cluster (pods) — só dela o X-Forwarded-For é aceito
  # pelo rate limit do reenvio de verificação de e-mail. Ajustar ao pod CIDR real do cluster.
  RATE_LIMIT_TRUSTED_PROXIES: 10.0.0.0/8
  # SDD-020: base do link de verificação de e-mail (<APP_FRONTEND_URL>/verify-email?token=...).
  # Ajustar à URL pública do front no cluster.
  APP_FRONTEND_URL: http://localhost:5173
  EMAIL_VERIFICATION_TOKEN_TTL: 24h