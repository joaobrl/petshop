apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-clientes-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-clientes
  template:
    metadata:
      labels:
        app: api-clientes
    spec:
      containers:
        - name: api-clientes
          image: api-clientes:latest
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            # UID/GID 10001 do usuário "spring" definido em customer-management/Dockerfile.
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          # Resource Server (SDD-024): JWKS pela rede interna, iss público (KC_HOSTNAME
          # de k8s/keycloak/configmap.yaml).
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: http://localhost:30180/realms/petshop
            - name: KEYCLOAK_JWK_SET_URI
              value: http://keycloak-svc:8080/realms/petshop/protocol/openid-connect/certs
            - name: KEYCLOAK_AUDIENCE
              value: customer-management
            # Admin API do Keycloak (SDD-024 F3): Client Credentials do client
            # customer-management-admin; segredo do keycloak-secret (k8s/keycloak).
            - name: KEYCLOAK_ADMIN_URL
              value: http://keycloak-svc:8080
            - name: KEYCLOAK_TOKEN_URI
              value: http://keycloak-svc:8080/realms/petshop/protocol/openid-connect/token
            - name: KEYCLOAK_CLIENT_ID
              value: customer-management-admin
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KEYCLOAK_CLIENT_SECRET_CUSTOMER_MANAGEMENT_ADMIN
          envFrom:
            - configMapRef:
                name: api-clientes-config
            - secretRef:
                name: db-clientes-secret
            - secretRef:
                name: api-clientes-secret
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

            # Health Checks
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10