# Exemplo SEM valores reais. Copie para k8s/keycloak/secret.yaml, preencha e aplique;
# nunca commite o valor real (mesmo padrão dos demais secrets de k8s/).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
  # Resolvidos como ${VAR} no realm-petshop.json durante o import.
  KEYCLOAK_CLIENT_SECRET_CUSTOMER_MANAGEMENT_ADMIN: CHANGE_ME
  KEYCLOAK_CLIENT_SECRET_BOOKING_SERVICE: CHANGE_ME
  KEYCLOAK_CLIENT_SECRET_ORDER_SERVICE: CHANGE_ME
  KEYCLOAK_CLIENT_SECRET_STAFF_SERVICE: CHANGE_ME
  # SMTP do realm (e-mails de definir/redefinir senha), tambem resolvido no import.
  # Padrao: SMTP relay da Brevo (porta 587, STARTTLS).
  KEYCLOAK_SMTP_HOST: smtp-relay.brevo.com
  KEYCLOAK_SMTP_PORT: "587"
  KEYCLOAK_SMTP_FROM: CHANGE_ME
  KEYCLOAK_SMTP_USER: CHANGE_ME
  KEYCLOAK_SMTP_PASSWORD: CHANGE_ME
