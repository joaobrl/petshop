apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0
          args: ["start-dev", "--import-realm"]
          securityContext:
            runAsNonRoot: true
            # UID 1000 do usuário "keycloak" da imagem oficial: sem UID numérico o
            # kubelet recusa o pod (CreateContainerConfigError), como nos demais serviços.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: keycloak-config
            # KC_BOOTSTRAP_ADMIN_* e KEYCLOAK_CLIENT_SECRET_* (k8s/keycloak/secret.example.yaml).
            - secretRef:
                name: keycloak-secret
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              memory: "768Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1"

          # Health Checks (porta de management, KC_HEALTH_ENABLED=true)
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
