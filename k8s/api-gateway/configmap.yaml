apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  # Rotas do gateway apontando para os *-svc do cluster (portas dos service.yaml).
  GATEWAY_PRODUCTS_URL: http://api-produtos-svc:8080
  GATEWAY_CUSTOMERS_URL: http://api-clientes-svc:8080
  GATEWAY_STAFF_URL: http://api-staff-svc:8085
  GATEWAY_BOOKING_URL: http://api-booking-svc:8083
  GATEWAY_ORDER_URL: http://api-order-svc:8086
  # Mesmo default do docker-compose. Ajustar à origem real do frontend no cluster.
  GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
  # Redis do rate limiting (SDD-022). Se cair, o gateway entra em fail-open.
  SPRING_DATA_REDIS_HOST: redis-svc
  SPRING_DATA_REDIS_PORT: "6379"
