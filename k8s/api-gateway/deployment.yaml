apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            # UID/GID 10001 do usuário "spring" definido em gateway-service/Dockerfile:
            # sem eles o kubelet recusa o pod, porque não consegue provar que o
            # usuário por nome não é root (CreateContainerConfigError).
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          # Keycloak (SDD-024): valida o Bearer via JWKS só para a chave do rate limit
          # (user:<sub>). JWKS pela rede interna, iss público (KC_HOSTNAME).
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: http://localhost:30180/realms/petshop
            - name: KEYCLOAK_JWK_SET_URI
              value: http://keycloak-svc:8080/realms/petshop/protocol/openid-connect/certs
          envFrom:
            - configMapRef:
                name: api-gateway-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

            # Health Checks
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
