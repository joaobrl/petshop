apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-produtos-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-produtos
  template:
    metadata:
      labels:
        app: api-produtos
    spec:
      containers:
        - name: api-produtos
          image: api-produtos:latest
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            # UID/GID 10001 do usuário "spring" definido em product-registration/Dockerfile.
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          # Resource Server (SDD-024): JWKS pela rede interna, iss público (KC_HOSTNAME
          # de k8s/keycloak/configmap.yaml).
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: http://localhost:30180/realms/petshop
            - name: KEYCLOAK_JWK_SET_URI
              value: http://keycloak-svc:8080/realms/petshop/protocol/openid-connect/certs
            - name: KEYCLOAK_AUDIENCE
              value: product-registration
          envFrom:
            - configMapRef:
                name: api-produtos-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

            # Health Checks
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10