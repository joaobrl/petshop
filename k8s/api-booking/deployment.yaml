apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-booking-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-booking
  template:
    metadata:
      labels:
        app: api-booking
    spec:
      containers:
        - name: api-booking
          image: api-booking:latest
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            # UID/GID 10001 do usuário "spring" definido em booking-service/Dockerfile.
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          # Resource Server (SDD-024): JWKS pela rede interna, iss público (KC_HOSTNAME
          # de k8s/keycloak/configmap.yaml).
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: http://localhost:30180/realms/petshop
            - name: KEYCLOAK_JWK_SET_URI
              value: http://keycloak-svc:8080/realms/petshop/protocol/openid-connect/certs
            - name: KEYCLOAK_AUDIENCE
              value: booking-service
            # Client Credentials das chamadas Feign (client booking-service do realm petshop).
            - name: KEYCLOAK_TOKEN_URI
              value: http://keycloak-svc:8080/realms/petshop/protocol/openid-connect/token
            - name: KEYCLOAK_CLIENT_ID
              value: booking-service
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KEYCLOAK_CLIENT_SECRET_BOOKING_SERVICE
          envFrom:
            - configMapRef:
                name: api-booking-config
            - secretRef:
                name: db-booking-secret
            - secretRef:
                name: api-booking-secret
          ports:
            - containerPort: 8083
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

            # Health Checks
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
