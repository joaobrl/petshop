apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7.0
          envFrom:
            - secretRef:
                name: kafka-secret
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            # Só listener INTERNAL — diferente do docker-compose, aqui não
            # existe um cliente externo ao cluster k8s acessando o Kafka.
            - name: KAFKA_CFG_LISTENERS
              value: INTERNAL://:9092,CONTROLLER://:9093
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: INTERNAL://kafka-svc:9092
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT
            - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CFG_SASL_ENABLED_MECHANISMS
              value: PLAIN
            - name: KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: PLAIN
            - name: KAFKA_CLIENT_USERS
              value: "$(KAFKA_BOOKING_USERNAME),$(KAFKA_ORDER_USERNAME),$(KAFKA_NOTIFICATION_USERNAME),$(KAFKA_CUSTOMER_USERNAME)"
            - name: KAFKA_CLIENT_PASSWORDS
              value: "$(KAFKA_BOOKING_PASSWORD),$(KAFKA_ORDER_PASSWORD),$(KAFKA_NOTIFICATION_PASSWORD),$(KAFKA_CUSTOMER_PASSWORD)"
          ports:
            - containerPort: 9092
            - containerPort: 9093
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
