spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Ver comentário equivalente em main/resources/application.yml: no Boot 4
  # o caminho correto é spring.mongodb.representation.uuid, não
  # spring.data.mongodb.uuid-representation.
  mongodb:
    representation:
      uuid: standard

server:
  port: 8080

# Keycloak de teste (SDD-024 RF4): sem Keycloak real. Os testes assinam RS256 com
# chave gerada em memória (support.TestJwtService) e o support.TestJwtDecoderConfig
# troca o JwtDecoder do JWKS por um que confere essa chave, com os mesmos
# validadores de produção (iss/exp/aud abaixo). O jwk-set-uri nunca é chamado.
keycloak:
  issuer-uri: http://localhost:8180/realms/petshop
  jwk-set-uri: http://localhost:8180/realms/petshop/protocol/openid-connect/certs
  audience: customer-management
  # Admin API (SDD-024 F3): nunca chamada nos testes — o
  # support.TestIdentityProviderConfig troca o adapter por um mock.
  client:
    token-uri: http://localhost:8180/realms/petshop/protocol/openid-connect/token
    id: customer-management-admin
    secret: test-secret
  admin:
    base-url: http://localhost:8180
    realm: petshop

# Mesmas chaves do main/resources/application.yml — precisa existir aqui
# porque este arquivo substitui (não complementa) o de main no classpath de
# teste, e o BootstrapAdminRunner não tem mais default embutido no @Value.
bootstrap:
  admin:
    name: Admin Petshop
    email: admin@petshop.local
    cpf: "00000000000"
    phone: "00000000000"
