server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clientes_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # No Boot 4, o namespace de configuração do Mongo é spring.mongodb.* (não
  # spring.data.mongodb.* — esse é ignorado silenciosamente pela
  # autoconfiguração, sem erro nenhum, e o driver cai no default embutido
  # localhost:27017). Ver o mesmo comentário em src/test/resources.
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/customer_history_db}
    representation:
      uuid: standard
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_CUSTOMER_USERNAME}" password="${KAFKA_CUSTOMER_PASSWORD}";'
    consumer:
      # Os dois listeners reais (BookingHistoryKafkaListener,
      # OrderHistoryKafkaListener) NÃO usam a factory default que o Boot
      # monta a partir daqui — cada um tem sua própria
      # ConcurrentKafkaListenerContainerFactory tipada, com o
      # ErrorHandlingDeserializer/JsonDeserializer construído em código
      # (ver KafkaConsumerConfig), porque cada tópico precisa de um tipo-alvo
      # diferente (BookingEventDTO vs. OrderCompletedEventDTO) — um único
      # spring.json.value.default.type global não serviria pros dois. Group
      # id/offset-reset abaixo ainda são usados (KafkaConsumerConfig reaproveita
      # esta seção via KafkaProperties.buildConsumerProperties()).
      group-id: ${KAFKA_CONSUMER_GROUP:customer-group}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Resource Server (SDD-024): valida o access token do Keycloak. O JWKS é buscado
# pela rede interna (http://keycloak:8080 no compose); o iss esperado é o público,
# fixado no Keycloak por KC_HOSTNAME. audience = id deste serviço, que precisa
# estar no aud do token (audience mappers do realm petshop).
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/petshop}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/petshop/protocol/openid-connect/certs}
  audience: ${KEYCLOAK_AUDIENCE:customer-management}
  # Admin API (SDD-024 F3): o cadastro cria/mantém os usuários no realm. Client
  # Credentials com o client customer-management-admin (manage-users); segredo =
  # KEYCLOAK_CLIENT_SECRET_CUSTOMER_MANAGEMENT_ADMIN do .env. Nenhum token é assinado aqui.
  client:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/petshop/protocol/openid-connect/token}
    id: ${KEYCLOAK_CLIENT_ID:customer-management-admin}
    secret: ${KEYCLOAK_CLIENT_SECRET:}
  admin:
    base-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:petshop}
    # Client e redirect (app.frontend-base-url) do link do e-mail de ação UPDATE_PASSWORD.
    web-client-id: ${KEYCLOAK_WEB_CLIENT_ID:web}

# Verificação de e-mail do cliente (SDD-020). O link enviado por e-mail é
# ${app.frontend-base-url}/verify-email?token=<token>; o token vale
# token-ttl (Duration: 24h, 30m...) e é de uso único.
app:
  frontend-base-url: ${APP_FRONTEND_URL:http://localhost:5173}
  email-verification:
    token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}

# CIDRs (separados por vírgula) dos proxies cujo X-Forwarded-For o
# RateLimitingFilter aceita para achar o IP real do cliente (ver
# ClientIpResolver). Vazio = não confia em ninguém, limita por remoteAddr.
# docker-compose/k8s setam a rede interna onde o gateway roda.
rate-limit:
  trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}

# Funcionário ADMIN criado automaticamente (ver BootstrapAdminRunner): localmente
# só quando a tabela de staff está vazia; no Keycloak, garantido a cada start
# (idempotente). Com BOOTSTRAP_ADMIN_PASSWORD, ela é a credencial (não temporária);
# vazia = usuário sem senha + e-mail do Keycloak para definir a senha. Sem senha
# provisória gerada.
bootstrap:
  admin:
    name: ${BOOTSTRAP_ADMIN_NAME:Admin Petshop}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@petshop.local}
    cpf: ${BOOTSTRAP_ADMIN_CPF:00000000000}
    phone: ${BOOTSTRAP_ADMIN_PHONE:00000000000}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"
  level:
    # O Hibernate 7 (categoria org.hibernate.orm.jdbc.error, antigo
    # SqlExceptionHelper) loga a mensagem crua do Postgres, com o valor que
    # violou a constraint ("Key (cpf)=(...)") — CPF em texto claro (SDD-029).
    # A exceção continua subindo e o BaseExceptionHandler loga a mesma falha
    # com os valores mascarados, então o diagnóstico não se perde.
    org.hibernate.orm.jdbc.error: "OFF"

# DEBUG/TRACE de segurança e Hibernate (loga parâmetros de bind SQL — CPF,
# dados pessoais — em texto claro) gatiados atrás do
# profile "dev": nunca ativos por padrão (docker-compose/k8s não setam
# SPRING_PROFILES_ACTIVE), só quando alguém liga esse profile explicitamente
# pra debugar localmente. O mesmo profile liga o seed de funcionários de dev
# (DevStaffSeedRunner), com a senha de dev conhecida abaixo (não é segredo: só dev).
---
spring:
  config:
    activate:
      on-profile: dev
dev:
  seed:
    staff-password: ${DEV_SEED_STAFF_PASSWORD:Petshop@dev123}
logging:
  level:
    org:
      springframework:
        security: DEBUG
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
