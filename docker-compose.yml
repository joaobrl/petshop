version: '3.8'

# depends_on sozinho só espera o container iniciar, não aceitar conexão.
# Os consumidores esperam db/mongo/kafka ficarem healthy.
x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

# Resource Server (SDD-024): cada serviço busca o JWKS pela rede interna
# (keycloak:8080) e confere o iss público, fixado por KC_HOSTNAME no keycloak.
x-keycloak-resource-server: &keycloak-resource-server
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/petshop
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/petshop/protocol/openid-connect/certs
  # Token endpoint do Client Credentials dos serviços chamadores (F4).
  KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/petshop/protocol/openid-connect/token

services:
  db:
    image: postgres:14
    container_name: shared-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - shared_db_data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      <<: *healthcheck-timing

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: petshop-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Health em /health/ready na porta de management (9000), não exposta no host.
      KC_HEALTH_ENABLED: "true"
      # Issuer fixo (http://localhost:8180/realms/petshop) para o navegador e para
      # os containers, que buscam o JWKS por http://keycloak:8080 (rede interna).
      KC_HOSTNAME: http://localhost:8180
      # Segredos dos clients confidenciais, resolvidos via ${VAR} no realm-petshop.json.
      KEYCLOAK_CLIENT_SECRET_CUSTOMER_MANAGEMENT_ADMIN: ${KEYCLOAK_CLIENT_SECRET_CUSTOMER_MANAGEMENT_ADMIN}
      KEYCLOAK_CLIENT_SECRET_BOOKING_SERVICE: ${KEYCLOAK_CLIENT_SECRET_BOOKING_SERVICE}
      KEYCLOAK_CLIENT_SECRET_ORDER_SERVICE: ${KEYCLOAK_CLIENT_SECRET_ORDER_SERVICE}
      KEYCLOAK_CLIENT_SECRET_STAFF_SERVICE: ${KEYCLOAK_CLIENT_SECRET_STAFF_SERVICE}
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      db:
        condition: service_healthy
    # A imagem não tem curl: o check abre o socket da porta 9000 com bash.
    # start_period maior porque o primeiro boot cria o schema e importa o realm.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      <<: *healthcheck-timing
      start_period: 40s

  api-products:
    build:
      context: .
      dockerfile: product-registration/Dockerfile
    container_name: api-products
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/produtos_db
      <<: *keycloak-resource-server
      KEYCLOAK_AUDIENCE: product-registration
    ports:
      - "8081:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      mongo:
        condition: service_healthy

  api-customers:
    build:
      context: .
      dockerfile: customer-management/Dockerfile
    container_name: api-customers
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/customer_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/customer_history_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CUSTOMER_USERNAME: ${KAFKA_CUSTOMER_USERNAME}
      KAFKA_CUSTOMER_PASSWORD: ${KAFKA_CUSTOMER_PASSWORD}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-customer-group}
      <<: *keycloak-resource-server
      KEYCLOAK_AUDIENCE: customer-management
      # Só a emissão legada do token no login (JwtService); nenhum serviço valida
      # mais esse token. Sai na SDD-024 F3 (login via Keycloak).
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      # SDD-020: base do link de verificação de e-mail (<APP_FRONTEND_URL>/verify-email?token=...).
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      EMAIL_VERIFICATION_TOKEN_TTL: ${EMAIL_VERIFICATION_TOKEN_TTL:-24h}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin Petshop}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@petshop.local}
      BOOTSTRAP_ADMIN_CPF: ${BOOTSTRAP_ADMIN_CPF:-00000000000}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-00000000000}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Faixa padrão das redes bridge do Docker, onde o api-gateway roda.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-172.16.0.0/12}
    ports:
      - "8082:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-staff:
    build:
      context: .
      dockerfile: staff-service/Dockerfile
    container_name: api-staff
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/staff_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXTERNAL_API_CUSTOMER_MANAGEMENT_URL: http://api-customers:8080
      <<: *keycloak-resource-server
      KEYCLOAK_AUDIENCE: staff-service
      KEYCLOAK_CLIENT_ID: staff-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET_STAFF_SERVICE}
    ports:
      - "8085:8085"
    depends_on:
      keycloak:
        condition: service_healthy
      db:
        condition: service_healthy
      api-customers:
        condition: service_started

  api-booking:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: api-booking
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/booking_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOKING_USERNAME: ${KAFKA_BOOKING_USERNAME}
      KAFKA_BOOKING_PASSWORD: ${KAFKA_BOOKING_PASSWORD}
      EXTERNAL_API_STAFF_SERVICE_URL: http://api-staff:8085
      # Cache de horários compartilhado (SDD-023): mesmo Redis do rate limit do gateway.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      <<: *keycloak-resource-server
      KEYCLOAK_AUDIENCE: booking-service
      KEYCLOAK_CLIENT_ID: booking-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET_BOOKING_SERVICE}
    ports:
      - "8083:8083"
    depends_on:
      keycloak:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-order:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: api-order
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDER_USERNAME: ${KAFKA_ORDER_USERNAME}
      KAFKA_ORDER_PASSWORD: ${KAFKA_ORDER_PASSWORD}
      EXTERNAL_API_PRODUCT_SERVICE_URL: http://api-products:8080
      EXTERNAL_API_CUSTOMER_SERVICE_URL: http://api-customers:8080
      <<: *keycloak-resource-server
      KEYCLOAK_AUDIENCE: order-service
      KEYCLOAK_CLIENT_ID: order-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET_ORDER_SERVICE}
    ports:
      - "8086:8086"
    depends_on:
      keycloak:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api-customers:
        condition: service_started
      api-products:
        condition: service_started

  api-notification:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: api-notification
    environment:
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_TEMPLATE_REGISTRATION_CONFIRMED: ${BREVO_TEMPLATE_REGISTRATION_CONFIRMED}
      BREVO_TEMPLATE_BOOKING_SCHEDULED: ${BREVO_TEMPLATE_BOOKING_SCHEDULED}
      BREVO_TEMPLATE_BOOKING_COMPLETED: ${BREVO_TEMPLATE_BOOKING_COMPLETED}
      BREVO_TEMPLATE_BOOKING_CANCELED: ${BREVO_TEMPLATE_BOOKING_CANCELED}
      BREVO_TEMPLATE_ORDER_AWAITING_PAYMENT: ${BREVO_TEMPLATE_ORDER_AWAITING_PAYMENT}
      BREVO_TEMPLATE_PAYMENT_CONFIRMED: ${BREVO_TEMPLATE_PAYMENT_CONFIRMED}
      BREVO_TEMPLATE_INVOICE_ISSUED: ${BREVO_TEMPLATE_INVOICE_ISSUED}
      BREVO_TEMPLATE_PICKUP_WINDOW: ${BREVO_TEMPLATE_PICKUP_WINDOW}
      BREVO_TEMPLATE_ORDER_READY_FOR_PICKUP: ${BREVO_TEMPLATE_ORDER_READY_FOR_PICKUP}
      BREVO_TEMPLATE_CART_REMINDER: ${BREVO_TEMPLATE_CART_REMINDER}
      BREVO_TEMPLATE_PASSWORD_RESET: ${BREVO_TEMPLATE_PASSWORD_RESET}
      BREVO_TEMPLATE_EMAIL_VERIFICATION: ${BREVO_TEMPLATE_EMAIL_VERIFICATION:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_NOTIFICATION_USERNAME: ${KAFKA_NOTIFICATION_USERNAME}
      KAFKA_NOTIFICATION_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: api-gateway
    environment:
      GATEWAY_PRODUCTS_URL: http://api-products:8080
      GATEWAY_CUSTOMERS_URL: http://api-customers:8080
      GATEWAY_STAFF_URL: http://api-staff:8085
      GATEWAY_BOOKING_URL: http://api-booking:8083
      GATEWAY_ORDER_URL: http://api-order:8086
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Rate limiting (SDD-022): baldes no Redis; o Bearer é validado via JWKS do
      # Keycloak (SDD-024) só para limitar por usuário (sub) em vez de IP.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/petshop
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/petshop/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      api-products:
        condition: service_started
      api-customers:
        condition: service_started
      api-staff:
        condition: service_started
      api-booking:
        condition: service_started
      api-order:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: petshop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-timing

  mongo:
    image: mongo:6.0
    container_name: shared-mongo
    ports:
      - "27017:27017"
    volumes:
      - shared_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"]
      <<: *healthcheck-timing

  kafka:
    image: bitnamilegacy/kafka:3.7.0
    container_name: petshop-kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN

      - KAFKA_CLIENT_USERS=${KAFKA_BOOKING_USERNAME},${KAFKA_ORDER_USERNAME},${KAFKA_NOTIFICATION_USERNAME},${KAFKA_CUSTOMER_USERNAME}
      - KAFKA_CLIENT_PASSWORDS=${KAFKA_BOOKING_PASSWORD},${KAFKA_ORDER_PASSWORD},${KAFKA_NOTIFICATION_PASSWORD},${KAFKA_CUSTOMER_PASSWORD}

      - KAFKA_INTER_BROKER_USER=${KAFKA_INTER_BROKER_USER:-petbooking_app}
      - KAFKA_INTER_BROKER_PASSWORD=${KAFKA_INTER_BROKER_PASSWORD}
    # Os listeners de broker exigem SASL, então o check monta um client config
    # com o usuário inter-broker. Timeout maior porque o script sobe uma JVM.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s";\n'
          "$${KAFKA_INTER_BROKER_USER}" "$${KAFKA_INTER_BROKER_PASSWORD}" > /tmp/healthcheck.properties &&
          /opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
          --command-config /tmp/healthcheck.properties > /dev/null
      <<: *healthcheck-timing
      timeout: 15s
volumes:
  shared_db_data:
    driver: local
  shared_mongo_data:
    driver: local
