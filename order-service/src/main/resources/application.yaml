server:
  port: ${SERVER_PORT:8086}

external:
  api:
    product-service:
      url: ${EXTERNAL_API_PRODUCT_SERVICE_URL:http://localhost:8081}
    customer-service:
      url: ${EXTERNAL_API_CUSTOMER_SERVICE_URL:http://localhost:8082}

spring:
  application:
    name: order-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: BASIC

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_ORDER_USERNAME}" password="${KAFKA_ORDER_PASSWORD}";'

# Resource Server (SDD-024): valida o access token do Keycloak. O JWKS é buscado
# pela rede interna (http://keycloak:8080 no compose); o iss esperado é o público,
# fixado no Keycloak por KC_HOSTNAME. audience = id deste serviço, que precisa
# estar no aud do token (audience mappers do realm petshop).
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/petshop}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/petshop/protocol/openid-connect/certs}
  audience: ${KEYCLOAK_AUDIENCE:order-service}
  # Client Credentials das chamadas Feign sem usuário para repassar (client
  # order-service do realm; segredo = KEYCLOAK_CLIENT_SECRET_* do .env).
  client:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/petshop/protocol/openid-connect/token}
    id: ${KEYCLOAK_CLIENT_ID:order-service}
    secret: ${KEYCLOAK_CLIENT_SECRET:}

# Regras do fluxo de compra
order:
  cart:
    # Carrinho não reserva estoque: depois disso sem atividade é só
    # "abandonado" (EXPIRED + lembrete por e-mail).
    abandoned-after-hours: 24
    expiration-check-interval-ms: 600000  # 10 min
  payment:
    mock-delay-seconds: 30
    check-interval-ms: 10000  # 10 seg
    # Estoque reservado no checkout fica preso só esse tempo esperando
    # pagamento; depois o pedido é cancelado e a reserva liberada.
    reservation-ttl-minutes: 30
    expiration-check-interval-ms: 60000  # 1 min
  pickup:
    min-delay-minutes: 1
    max-delay-minutes: 60
    check-interval-ms: 10000  # 10 seg

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"
  level:
    org.springframework.kafka: INFO
