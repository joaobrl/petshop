server:
  port: 8086

# URLs dummy — os testes de integração mockam os ports (CustomerPortOut/
# ProductStockPortOut), então os Feign clients nunca chegam a fazer uma
# chamada de verdade; só precisam resolver pra o contexto subir.
external:
  api:
    product-service:
      url: http://localhost:0
    customer-service:
      url: http://localhost:0

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Sem SASL aqui (diferente do main/resources/application.yaml): o
  # KafkaTemplate não precisa de um broker alcançável só pra o contexto
  # subir, e os testes que tocam mensageria mockam o KafkaTemplate direto.
  kafka:
    bootstrap-servers: localhost:9092

# Keycloak de teste (SDD-024 RF4): sem Keycloak real. Os testes assinam RS256 com
# chave gerada em memória (support.TestJwtService) e o support.TestJwtDecoderConfig
# troca o JwtDecoder do JWKS por um que confere essa chave, com os mesmos
# validadores de produção (iss/exp/aud abaixo). O jwk-set-uri nunca é chamado.
keycloak:
  issuer-uri: http://localhost:8180/realms/petshop
  jwk-set-uri: http://localhost:8180/realms/petshop/protocol/openid-connect/certs
  audience: order-service
  client:
    token-uri: http://localhost:8180/realms/petshop/protocol/openid-connect/token
    id: order-service
    secret: test-client-secret

order:
  cart:
    abandoned-after-hours: 24
    expiration-check-interval-ms: 600000
  payment:
    mock-delay-seconds: 30
    check-interval-ms: 10000
    reservation-ttl-minutes: 30
    expiration-check-interval-ms: 60000
  pickup:
    min-delay-minutes: 1
    max-delay-minutes: 60
    check-interval-ms: 10000
